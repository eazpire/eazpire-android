# JVM args reduced to avoid "Unknown option -X" in CI (GRADLE_OPTS parsing)
org.gradle.jvmargs=-Dfile.encoding=UTF-8
# Maven Central may return 403 without an explicit User-Agent (common on GitHub Actions).
systemProp.http.agent=Gradle/eazpire-android
systemProp.https.agent=Gradle/eazpire-android
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
# Windows: avoid Kotlin daemon / incremental temp-dir delete failures under %TEMP%/eazpire-android-build
kotlin.compiler.execution.strategy=in-process
kotlin.incremental=false
# AGP 9.x (Android Studio sync)
android.newDsl=false
android.builtInKotlin=false
