# Copy Creator Play secrets + upload keystore to the Shop mirror (option B).
# Run on eazpire-android: Actions → "Propagate Play secrets to Shop mirror"
#
# Requires on THIS repo (eazpire-android):
#   PLAY_SERVICE_ACCOUNT_JSON + ANDROID_KEYSTORE_*
#   ANDROID_REPO_PUSH_TOKEN (repo + secrets:write + variables on eazpire-android-shop)
#
# Always dispatches Shop Google Play (AAB) on track **internal** — never production.

name: Propagate Play secrets to Shop mirror

on:
  workflow_dispatch:

jobs:
  propagate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Copy secrets and vars to eazpire-android-shop
        env:
          GH_TOKEN: ${{ secrets.ANDROID_REPO_PUSH_TOKEN || secrets.GITHUB_TOKEN }}
          PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=""
          for name in PLAY_JSON KS_B64 KS_PASS KS_ALIAS KEY_PASS; do
            eval "val=\$$name"
            if [ -z "$val" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing secrets on eazpire-android:$missing"
            exit 1
          fi
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::Set ANDROID_REPO_PUSH_TOKEN on eazpire-android (needed to write Shop mirror secrets)."
            exit 1
          fi

          repo="eazpire/eazpire-android-shop"
          echo "=== $repo (option B: copy Creator Play secrets + keystore) ==="
          echo "$PLAY_JSON" | gh secret set PLAY_SERVICE_ACCOUNT_JSON -R "$repo"
          echo "$KS_B64" | gh secret set ANDROID_KEYSTORE_BASE64 -R "$repo"
          echo "$KS_PASS" | gh secret set ANDROID_KEYSTORE_PASSWORD -R "$repo"
          echo "$KS_ALIAS" | gh secret set ANDROID_KEY_ALIAS -R "$repo"
          echo "$KEY_PASS" | gh secret set ANDROID_KEY_PASSWORD -R "$repo"
          gh variable set ENABLE_GOOGLE_PLAY --body "true" -R "$repo"
          gh variable set PLAY_DEFAULT_TRACK --body "internal" -R "$repo"
          gh variable set PLAY_VERSION_CODE_BASE --body "3000000000" -R "$repo"
          echo "OK: secrets + ENABLE_GOOGLE_PLAY=true + PLAY_DEFAULT_TRACK=internal copied to $repo"

      - name: Dispatch Shop Google Play (AAB) on internal
        env:
          GH_TOKEN: ${{ secrets.ANDROID_REPO_PUSH_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Give GitHub a moment to expose newly written Actions variables to the next workflow.
          sleep 10
          gh workflow run "Google Play (AAB)" -R eazpire/eazpire-android-shop --ref main -f track=internal
          echo "Dispatched Google Play (AAB) track=internal on eazpire/eazpire-android-shop"
